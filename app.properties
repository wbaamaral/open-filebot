# Build
main.class: net.filebot.Main
jre.version: 25

# Minimum System Version
jvm.version: 25
mac.version: 10.10

# Package Information
package.name: filebot
package.identifier: net.filebot.FileBot
package.developer: FileBot Community
package.maintainer: community@filebot
package.company: Open Source
package.project: FileBot
package.synopsis: O organizador e renomeador definitivo de Filmes e Séries
package.description: FileBot é a ferramenta definitiva para organizar e renomear seus Filmes, Séries de TV e Animes.
package.tags: Mass Renamer, Rename TV shows, Rename movies, Organize media files, Fetch Subtitles, Check SFV files, Plex Media Server, Kodi Media Center, TheTVDB, TheMovieDB, OpenSubtitles
package.homepage: https://github.com/wbaamaral/filebot

# Distribution-specific Package Information
microsoft.application.name: PointPlanck.FileBot
microsoft.application.publisher: CN=Example.com(Test)

# Platform-specific Package Information
mac.application.category: public.app-category.utilities
deb.application.categories: AudioVideo;Video;Utility;FileTools;
deb.application.mimetype: inode/directory;video/*;audio/*;text/*;application/*;
deb.application.class: net-filebot-Main

# Commands
deb.application.action.import: filebot -script fn:amc --output "$HOME/Media" --action duplicate -non-strict --log-file "$HOME/Media/amc.log" --def excludeList="$HOME/Media/amc.excludes" unsorted=y music=y artwork=y

# Default Java Options
java.application.options: --enable-native-access=ALL-UNNAMED -Dunixfs=false -DuseExtendedFileAttributes=true -DuseCreationDate=false -Djava.net.useSystemProxies=true -Djna.nosys=false -Djna.nounpack=false --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.util.function=ALL-UNNAMED --add-opens=java.base/java.util.regex=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.nio.file=ALL-UNNAMED --add-opens=java.base/java.nio.file.attribute=ALL-UNNAMED --add-opens=java.base/java.nio.channels=ALL-UNNAMED --add-opens=java.base/java.nio.charset=ALL-UNNAMED --add-opens=java.base/java.time=ALL-UNNAMED --add-opens=java.logging/java.util.logging=ALL-UNNAMED --add-opens=java.desktop/java.awt=ALL-UNNAMED --add-opens=java.desktop/javax.swing.border=ALL-UNNAMED

