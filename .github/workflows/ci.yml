name: CI

on:
  push:
    branches: ['*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '25'

      - name: Instalar Apache Ant e Utilitários
        run: |
          sudo apt-get update
          sudo apt-get install -y ant ant-optional xz-utils curl

      - name: Configurar Apache Ivy e Suporte a XZ no Ant
        run: |
          mkdir -p ~/.ant/lib
          curl -fsSL https://repo1.maven.org/maven2/org/apache/ivy/ivy/2.5.2/ivy-2.5.2.jar -o ~/.ant/lib/ivy.jar
          curl -fsSL https://repo1.maven.org/maven2/org/tukaani/xz/1.6/xz-1.6.jar -o ~/.ant/lib/xz.jar

      - name: Resolver Dependências (Ivy)
        run: ant resolve

      - name: Rodar Testes Offline
        run: ant test
