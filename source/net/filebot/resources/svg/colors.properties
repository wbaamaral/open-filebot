#
# Icon color roles
#
# SVG icons are drawn with placeholder colors that are replaced at paint time by
# the design token of the current theme, so icons follow theme changes.
#
# role = placeholder color, design token
#

glyph = #FB0001, FileBot.icon.glyphColor
accent = #FB0002, FileBot.accentColor
success = #FB0003, FileBot.successColor
warning = #FB0004, FileBot.warningColor
danger = #FB0005, FileBot.dangerColor
info = #FB0006, FileBot.infoColor
muted = #FB0007, FileBot.mutedColor
onTile = #FB0008, FileBot.icon.onTileColor

tile.rename = #FB0101, FileBot.panel.renameColor
tile.episodes = #FB0102, FileBot.panel.episodesColor
tile.subtitles = #FB0103, FileBot.panel.subtitlesColor
tile.sfv = #FB0104, FileBot.panel.sfvColor
tile.filter = #FB0105, FileBot.panel.filterColor
tile.list = #FB0106, FileBot.panel.listColor
