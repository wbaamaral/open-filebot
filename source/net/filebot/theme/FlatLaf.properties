#
# Open FileBot design tokens (all FlatLaf themes)
#
# Single source of truth for spacing, radius, icon sizes, semantic colors and
# typography. Code must reference token keys (FileBot.*) or style classes
# (fb-*) and never literal values. Theme specific values are defined in
# FlatLightLaf.properties and FlatDarkLaf.properties.
#
# Naming rules (FlatLaf infers the value type from the key):
#   - colors end with "Color" (e.g. FileBot.accentColor)
#   - spacing, radius and icon sizes are plain integers in pixels
#   - composite borders are classes that read the tokens themselves
#


#---- spacing scale (px) ----

FileBot.space.xs = 4
FileBot.space.sm = 8
FileBot.space.md = 12
FileBot.space.lg = 16
FileBot.space.xl = 24


#---- corner radius (px) ----

FileBot.radius.sm = 6
FileBot.radius.md = 8
FileBot.radius.lg = 12


#---- icon sizes (px) ----

FileBot.icon.small = 16
FileBot.icon.medium = 24
FileBot.icon.large = 48


#---- semantic colors ----

FileBot.textColor = $Label.foreground
FileBot.mutedColor = $Label.disabledForeground
FileBot.accentColor = $Component.accentColor
FileBot.linkColor = $Component.linkColor
FileBot.borderColor = $Component.borderColor
FileBot.separatorColor = $Separator.foreground
FileBot.surfaceColor = $Panel.background
FileBot.surfaceRaisedColor = $TextArea.background

# icons: default glyph color and glyph color on colored tiles
FileBot.icon.glyphColor = $Label.foreground
FileBot.icon.onTileColor = #FFFFFF


#---- panel identity colors (sidebar tiles) ----

FileBot.panel.renameColor = #3B7DD8
FileBot.panel.episodesColor = #7C5CD6
FileBot.panel.subtitlesColor = #E07B39
FileBot.panel.sfvColor = #2E9D62
FileBot.panel.filterColor = #0F9AA8
FileBot.panel.listColor = #D2457B


#---- composite tokens ----

# rounded line border in FileBot.borderColor with FileBot.radius.md
FileBot.roundedBorder = net.filebot.util.ui.TokenBorder


#---- typography roles ----

[style].fb-title = font: +10
[style].fb-heading = font: bold
[style].fb-caption = font: -2; foreground: $FileBot.mutedColor
[style].fb-badge = font: -3
[style].fb-code = font: $monospaced.font
[style].fb-code-small = font: -3 $monospaced.font


#---- surfaces ----

# help and information boxes
[style]Panel.fb-info = background: $FileBot.surfaceAltColor; border: $FileBot.roundedBorder; arc: $FileBot.radius.md

# raised content cards (e.g. previews)
[style]Panel.fb-card = background: $FileBot.surfaceRaisedColor; border: $FileBot.roundedBorder; arc: $FileBot.radius.md

# dialog headers with title and description
[style]Panel.fb-header = background: $FileBot.surfaceRaisedColor

# panels that continue a table or list surface
[style]Panel.fb-list-surface = background: $Table.background
